<dialog class="lightbox" data-lightbox-dialog aria-label="Image viewer">
  <img alt="">
  <p class="lightbox__cap mono"></p>
  <button class="lightbox__close mono" type="button" data-close>Close ✕</button>
  <button class="lightbox__nav lightbox__prev" type="button" data-prev aria-label="Previous image">←</button>
  <button class="lightbox__nav lightbox__next" type="button" data-next aria-label="Next image">→</button>
</dialog>
